# Внешний мониторинг «Живой стали» (ADR-008, дополнен 2026-11-02).
# Каждые 5 минут GitHub Actions проверяет сайт, /api/health и /api/ready по ключевому слову;
# /api/health — ещё и с точки в России через Globalping. Тревоги — ботом в служебный чат
# (секреты NOTIFICATION_TELEGRAM_*), каждый сбой — задачей в этом репозитории.
owner: AgentSmoki
repo: zhivaya-stal-status
user-agent: zhivaya-stal-status

sites:
  - name: Сайт
    slug: site
    url: https://stal.neuroimpuls.ru/
    __dangerous__body_down_if_text_missing: Живая сталь
  - name: API
    slug: api
    url: https://stal.neuroimpuls.ru/api/health
    __dangerous__body_down_if_text_missing: '"status":"ok"'
  - name: Готовность — база, очередь, воркер
    slug: ready
    url: https://stal.neuroimpuls.ru/api/ready
    __dangerous__body_down_if_text_missing: '"status":"ok"'
  - name: API из России
    slug: api-russia
    url: https://stal.neuroimpuls.ru/api/health
    type: globalping
    location: Russia
    globalpingTimeout: 30
  # Временная проверка канала тревог: адрес отвечает 404 — должна прийти тревога в служебный чат
  - name: Проверка тревоги
    slug: alert-test
    url: https://stal.neuroimpuls.ru/api/upptime-alert-test
